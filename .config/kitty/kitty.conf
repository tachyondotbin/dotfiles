# --- font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font

# --- Wayland / rendering ---
linux_display_server  wayland
hide_window_decorations yes
sync_to_monitor       yes
repaint_delay         10
input_delay           3
wayland_enable_ime    no

# --- performance / memory (8 GB, no swap) ---
scrollback_lines          5000
scrollback_pager_history_size 0
cursor_blink_interval     0
mouse_hide_wait           -1
resize_debounce_time      0.05 0.05
update_check_interval     0
allow_remote_control      no
confirm_os_window_close   0

# --- behaviour ---
shell_integration       enabled
copy_on_select          clipboard
strip_trailing_spaces   smart
enable_audio_bell       no
window_padding_width    6
url_style               curly
open_url_with           default
detect_urls             yes

# --- cursor ---
cursor_shape            beam
cursor_beam_thickness   1.5

# --- tabs (Hyprland already tiles, so keep them minimal) ---
tab_bar_style           hidden

# --- colors (minimal dark; swap with `kitten themes`) ---
foreground              #cdd6f4
background              #000000
selection_foreground    #1e1e2e
selection_background    #f5e0dc
cursor                  #f5e0dc
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# --- keys ---
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0
map ctrl+shift+f5     load_config_file
