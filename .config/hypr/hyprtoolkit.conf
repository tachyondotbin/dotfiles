# ~/.config/hypr/hyprtoolkit.conf

# Pure pitch black backgrounds for maximum contrast
bg = 0xFF000000
bg_alternate = 0xFF0C0C0C

# Soft, chill pastel gold/yellow for accents, selections, and focus borders
accent = 0xFFF5D76E
accent_hover = 0xFFFAE696

# Light white primary text and soft grey inactive text
fg = 0xFFF0F0F0
fg_inactive = 0xFF8C8C8C

